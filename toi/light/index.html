<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Golos+Text:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  /* layout: an invitation card you scroll through. Two gold rings in 3D travel with the scroll and close around the date in the calendar. Phone first: guests open it from a WhatsApp link. */
  --paper:#F6F1E7; --paper0:rgba(246,241,231,0);
  --card:#FBF8F1; --glass:rgba(251,248,241,.82);
  --ink:#2A2420; --soft:#6F655B; --ph:#B5AA9B; --sw:rgba(42,36,32,.14);
  --gold:#9A6F26; --gold-l:#C9A45C; --line:rgba(154,111,38,.32);
  --glowA:#FFFDF8; --glowA0:rgba(255,253,248,0); --glowB:#EFE5D2; --glowB0:rgba(239,229,210,0);
  --serif:"Cormorant Garamond","Times New Roman",Georgia,serif;
  --body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
}
html[data-theme="dark"]{
  /* evening той: warm graphite, ivory type, gold that catches a spotlight */
  --paper:#13100E; --paper0:rgba(19,16,14,0);
  --card:#1B1714; --glass:rgba(27,23,20,.82);
  --ink:#EFE6D6; --soft:#A3978A; --ph:#6E655B; --sw:rgba(239,230,214,.2);
  --gold:#D4AE68; --gold-l:#A8864A; --line:rgba(212,174,104,.26);
  --glowA:rgba(212,174,104,.12); --glowA0:rgba(212,174,104,0); --glowB:rgba(96,54,30,.34); --glowB0:rgba(96,54,30,0);
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:light;overflow-x:hidden}
html[data-theme="dark"]{color-scheme:dark}
body{background:var(--paper);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;overflow-x:hidden;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse 80% 60% at 70% 12%,var(--glowA) 0%,var(--glowA0) 60%),radial-gradient(ellipse 70% 50% at 10% 90%,var(--glowB) 0%,var(--glowB0) 65%);pointer-events:none}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px;border-radius:6px}
#gl{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
@media (min-width:860px){html[data-theme="light"] #gl{filter:drop-shadow(0 26px 22px rgba(96,70,24,.22))}}
.frame{position:fixed;inset:10px;border:1px solid var(--line);z-index:6;pointer-events:none}
.frame::before,.frame::after{content:"";position:absolute;width:9px;height:9px;border:1px solid var(--gold-l);transform:rotate(45deg);background:var(--paper)}
.frame::before{left:50%;top:-5px;margin-left:-5px}.frame::after{left:50%;bottom:-5px;margin-left:-5px}
header::before{content:"";position:absolute;inset:0 0 -22px 0;background:linear-gradient(var(--paper) 45%,var(--paper0));z-index:-1;pointer-events:none}
header{position:fixed;left:0;right:0;top:0;display:flex;justify-content:space-between;align-items:center;padding:24px clamp(24px,4.4vw,60px);z-index:8}
.mono{font-family:var(--serif);font-size:22px;letter-spacing:.14em}
.mono i{font-style:italic;color:var(--gold)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--glass);font-size:12px;letter-spacing:.14em}
.lang button{padding:.55em 1em}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
main{position:relative;z-index:2;overflow-x:clip}
section{position:relative;padding:clamp(84px,13vh,150px) clamp(26px,7vw,120px)}
.eyebrow{font-size:12px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold)}
h1,h2{font-family:var(--serif);font-weight:500;line-height:.92;text-wrap:balance}
h2{font-size:clamp(40px,6.2vw,92px);margin-top:.25em}
h2 em{font-style:italic;color:var(--gold)}
.orn{display:block;width:150px;height:22px;color:var(--gold-l)}

/* 0 · hero */
#s0{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:space-between;padding-top:clamp(84px,14vh,130px);padding-bottom:clamp(40px,7vh,70px)}
#s0 .eyebrow{text-align:center}
.names{font-family:var(--serif);font-weight:500;font-size:clamp(66px,15.5vw,236px);line-height:.86;letter-spacing:-.02em}
.names span{display:block;will-change:transform}
.names .n2{text-align:right}
.names .amp{font-style:italic;font-weight:400;color:var(--gold);font-size:.42em;text-align:center;line-height:1.5;letter-spacing:0}
.hero-foot{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;font-size:clamp(13px,1.1vw,16px)}
.hero-foot b{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(26px,2.8vw,42px);line-height:1.05}
.hero-foot .r{text-align:right}
.scroll{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--soft);display:flex;flex-direction:column;align-items:center;gap:8px}
.scroll::after{content:"";width:1px;height:30px;background:linear-gradient(var(--gold),var(--paper0));animation:drip 1.8s ease-in-out infinite}
@keyframes drip{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}

/* 1 · invitation */
#s1{display:grid;grid-template-columns:minmax(0,1fr);justify-items:center;text-align:center;gap:26px}
#s1 .text{font-family:var(--serif);font-size:clamp(24px,3vw,44px);line-height:1.22;max-width:21em;text-wrap:balance}
#s1 .hosts{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--soft)}
#s1 .hosts b{display:block;font-family:var(--serif);font-weight:500;font-size:28px;letter-spacing:.02em;text-transform:none;color:var(--ink);margin-top:.3em}
.photo{width:min(300px,64vw);aspect-ratio:3/4;border:1px solid var(--line);border-radius:999px 999px 8px 8px;padding:9px}
.photo img{display:block;width:100%;height:100%;object-fit:cover;border-radius:999px 999px 4px 4px}

/* 2 · date */
#s2 .grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(30px,6vw,110px);align-items:center;margin-top:clamp(26px,4vw,54px)}
.bigdate{font-family:var(--serif);font-weight:500;font-size:clamp(64px,11vw,170px);line-height:.84;font-variant-numeric:lining-nums tabular-nums;letter-spacing:-.02em}
.bigdate small{display:block;font-family:var(--body);font-size:clamp(13px,1.1vw,16px);letter-spacing:.2em;text-transform:uppercase;color:var(--soft);line-height:1.6;margin-top:1.4em}
.count{display:flex;gap:clamp(14px,2.2vw,34px);margin-top:clamp(26px,4vw,48px)}
.count div{border-top:1px solid var(--line);padding-top:10px;min-width:3.6em}
.count b{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(30px,3.6vw,54px);line-height:1;font-variant-numeric:lining-nums tabular-nums}
.count span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--soft)}
.addcal{display:inline-flex;align-items:center;gap:.55em;margin-top:26px;font-size:14px;color:var(--gold);text-decoration:none;border-bottom:1px solid var(--line);padding-bottom:3px}
.addcal:hover{border-color:var(--gold)}
.cal{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:clamp(18px,2.6vw,34px);justify-self:end;width:min(100%,520px)}
.cal .mo{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--serif);font-size:clamp(22px,2.2vw,32px);margin-bottom:14px}
.cal .mo span:last-child{color:var(--gold);font-style:italic}
.cal .g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center}
.cal .g>*{aspect-ratio:1;display:grid;place-items:center;font-family:var(--serif);font-size:clamp(17px,1.8vw,26px);font-variant-numeric:lining-nums}
.cal .g .wd{font-family:var(--body);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);aspect-ratio:auto;padding-bottom:8px}
.cal .g .on{color:var(--gold);font-weight:600;font-size:clamp(21px,2.3vw,32px)}

/* 3 · program */
#s3 .list{margin-top:clamp(26px,4vw,54px);max-width:640px;border-left:1px solid var(--line)}
#s3 .row{display:grid;grid-template-columns:clamp(104px,11vw,170px) minmax(0,1fr);gap:18px;align-items:baseline;padding:18px 0 18px 26px;position:relative}
#s3 .row::before{content:"";position:absolute;left:-5px;top:1.9em;width:9px;height:9px;border-radius:50%;background:var(--paper);border:1px solid var(--gold)}
#s3 .row b{font-family:var(--serif);font-weight:500;font-size:clamp(30px,3.4vw,50px);line-height:1;font-variant-numeric:lining-nums tabular-nums}
#s3 .row div{font-size:clamp(16px,1.3vw,19px)}
#s3 .row small{display:block;color:var(--soft);font-size:14px}

/* 4 · place and dress code */
#s4 .cols{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:clamp(26px,5vw,80px);margin-top:clamp(26px,4vw,54px);margin-left:auto;max-width:1000px}
#s4 .cols.one{grid-template-columns:minmax(0,1fr);max-width:560px}
.place,.dress{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:clamp(22px,3vw,40px)}
.place h3,.dress h3{font-family:var(--serif);font-weight:500;font-size:clamp(28px,3vw,44px);line-height:1}
.place p,.dress p{color:var(--soft);margin-top:.7em;font-size:15px}
.btn{display:inline-flex;align-items:center;gap:.6em;margin-top:1.4em;background:var(--ink);color:var(--paper);border-radius:999px;padding:.85em 1.5em;font-weight:500;font-size:15px;text-decoration:none;transition:background .2s,color .2s}
.btn:hover{background:var(--gold);color:#1a1410}
.sw{display:flex;gap:12px;margin-top:1.3em;flex-wrap:wrap}
.sw div{text-align:center;font-size:11px;letter-spacing:.08em;color:var(--soft)}
.sw i{display:block;width:clamp(40px,4.4vw,58px);aspect-ratio:1;border-radius:50%;border:1px solid var(--sw);margin:0 auto 8px}

/* 5 · answer */
#s5{display:grid;justify-items:center;text-align:center}
form{margin-top:clamp(24px,3vw,40px);width:min(100%,520px);display:grid;gap:18px;text-align:left}
label,.lab{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);display:block;margin-bottom:8px}
input[type=text]{width:100%;font:inherit;font-family:var(--serif);font-size:26px;padding:.3em 0;border:0;border-bottom:1px solid var(--gold);background:transparent;color:var(--ink);border-radius:0}
input[type=text]::placeholder{color:var(--ph)}
.pick{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pick button{border:1px solid var(--line);border-radius:8px;padding:1em .8em;font-size:15px;background:var(--card);transition:background .2s,color .2s}
.pick button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.step{display:flex;align-items:center;gap:16px}
.step button{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);font-size:22px;line-height:1;background:var(--card)}
.step b{font-family:var(--serif);font-weight:500;font-size:34px;min-width:1.2em;text-align:center;font-variant-numeric:lining-nums}
#send{justify-content:center;margin-top:6px;font-size:16px;padding:1em 1.5em}
.note{font-size:13px;color:var(--soft);text-align:center}
footer{position:relative;z-index:2;text-align:center;padding:10px 26px 64px}
footer .bye{font-family:var(--serif);font-style:italic;font-size:clamp(30px,4.2vw,60px);color:var(--gold)}
footer small{display:block;margin-top:22px;font-size:12px;color:var(--soft);letter-spacing:.06em}
footer small a{text-decoration:none;border-bottom:1px solid var(--line)}

/* music */
#music{position:fixed;right:22px;bottom:22px;z-index:9;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:var(--glass);display:none;place-items:center;color:var(--gold)}
#music.on{background:var(--gold);color:var(--paper)}
#music svg{width:20px;height:20px}

@media (max-width:820px){
  header{padding:20px 22px}
  .names{font-size:21vw}
  .names .n2{margin-top:.1em}
  .hero-foot{font-size:13px}
  #s2 .grid{grid-template-columns:minmax(0,1fr)}
  .cal{justify-self:stretch;width:100%}
  #s4 .cols{grid-template-columns:minmax(0,1fr)}
  #s3 .row{grid-template-columns:92px minmax(0,1fr);padding-left:20px}
  #music{right:18px;bottom:18px;width:44px;height:44px}
}
@media (prefers-reduced-motion:reduce){.scroll::after{animation:none}}
</style>
</head>
<body>
<canvas id="gl" aria-hidden="true"></canvas>
<div class="frame" aria-hidden="true"></div>
<header>
  <div class="mono" id="mono"></div>
  <div class="lang" role="group" aria-label="Тіл / Язык"><button id="lkz" aria-pressed="true">ҚАЗ</button><button id="lru" aria-pressed="false">РУС</button></div>

<main>
  <section id="s0">

<script>
(function(){
'use strict';
const C=window.TOI;
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

 bye:'Ждём вас с нетерпением!',made:'Сайт сделан в',demo:'Концепт. Имена и адрес вымышлены',ph:'Например: Айгерим',

};
['kz','ru'].forEach(l=>{const t=T[l];t.event=esc(C.event[l]);t.invite=esc(C.invite[l]);t.venue=esc(C.venue[l]);t.addr=esc(C.address[l]);t.city=esc(C.city[l]);t.wday=DAYS[l][WD]});

/* ---------- fixed content from the settings ---------- */
const [N1,N2]=C.names;
$('#mono').innerHTML=`${esc(N1.charAt(0))} <i>&amp;</i> ${esc(N2.charAt(0))}`;
$('.n1').textContent=N1;$('.n2').textContent=N2;$('#names').setAttribute('aria-label',`${N1} & ${N2}`);
document.title=`${N1} & ${N2}`;
$('#hosts').textContent=C.hosts;
$('#heroDate').textContent=`${pad(D)} · ${pad(M)} · ${Y}`;$('#bigDate').textContent=`${pad(D)}.${pad(M)}`;$('#calYear').textContent=Y;
$('#map').href=C.map;
if(C.photo){$('#photo').hidden=false;$('#photo img').src=C.photo}
if(!C.dress||!C.dress.length){$('#dress').remove();$('#cols').classList.add('one')}
const icsT=t=>new Date(t).toISOString().replace(/[-:]/g,'').replace(/\.\d+/,'');
function calLink(){return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(`${N1} & ${N2}`)+'&dates='+icsT(START)+'/'+icsT(START+5*3600e3)+'&location='+encodeURIComponent(C.venue[L]+', '+C.address[L])}

let L='kz',will=true,count=2;
function buildCal(){const g=$('#cal');g.innerHTML='';T[L].wd.forEach(w=>{const d=document.createElement('div');d.className='wd';d.textContent=w;g.appendChild(d)});
  const lead=(new Date(Date.UTC(Y,M-1,1)).getUTCDay()+6)%7,days=new Date(Date.UTC(Y,M,0)).getUTCDate();
  for(let i=0;i<lead;i++)g.appendChild(document.createElement('span'));
  for(let d=1;d<=days;d++){const c=document.createElement('span');c.textContent=d;if(d===D){c.className='on';c.id='theday'}g.appendChild(c)}}
function buildProg(){$('#prog').innerHTML=C.program.map(p=>`<div class="row"><b>${esc(p.time)}</b><div><span>${esc(p[L][0])}</span><small>${esc(p[L][1]||'')}</small></div></div>`).join('');
  if($('#sw'))$('#sw').innerHTML=C.dress.map(s=>`<div><i style="background:${esc(s.color)}"></i><span>${esc(s[L])}</span></div>`).join('')}
function link(){const n=$('#gname').value.trim()||'—',num=String(C.whatsapp||'').replace(/\D/g,'');$('#send').href='https://wa.me/'+num+'?text='+encodeURIComponent(will?T[L].msgY(n,count):T[L].msgN(n))}
function credit(){const ig='<a href="https://www.instagram.com/sylormotion/" target="_blank" rel="noopener">Sylor Motion</a>';$('#credit').innerHTML=C.demo?`${T[L].demo} · ${ig}`:`${T[L].made} ${ig}`}
function setLang(l){L=l;document.documentElement.lang=l==='kz'?'kk':'ru';$$('[data-t]').forEach(el=>{el.innerHTML=T[l][el.dataset.t]});
  $('#lkz').setAttribute('aria-pressed',l==='kz');$('#lru').setAttribute('aria-pressed',l==='ru');$('#gname').placeholder=T[l].ph;
  buildCal();buildProg();link();credit();$('#addcal').href=calLink();if(window.__size)window.__size()}
$('#lkz').addEventListener('click',()=>setLang('kz'));$('#lru').addEventListener('click',()=>setLang('ru'));
$('#gname').addEventListener('input',link);
function pick(v){will=v;$('#yes').setAttribute('aria-pressed',v);$('#no').setAttribute('aria-pressed',!v);$('#cntw').style.display=v?'':'none';link();if(v&&window.__shashu)window.__shashu()}
$('#yes').addEventListener('click',()=>pick(true));$('#no').addEventListener('click',()=>pick(false));
$('#plus').addEventListener('click',()=>{count=Math.min(9,count+1);$('#cnt').textContent=count;link()});
$('#minus').addEventListener('click',()=>{count=Math.max(1,count-1);$('#cnt').textContent=count;link()});
$('#rsvp').addEventListener('submit',e=>e.preventDefault());
setLang('kz');

/* music: browsers allow sound only after a tap, so it is a button */
if(C.music){const a=new Audio(C.music),b=$('#music');a.loop=true;b.style.display='grid';b.setAttribute('aria-label','♪');
  b.addEventListener('click',()=>{if(a.paused){a.play().then(()=>{b.classList.add('on');b.setAttribute('aria-pressed','true')}).catch(()=>{})}else{a.pause();b.classList.remove('on');b.setAttribute('aria-pressed','false')}})}

/* countdown */
function tick(){let s=Math.max(0,Math.floor((START-Date.now())/1000));$('#cd').textContent=Math.floor(s/86400);s%=86400;$('#ch').textContent=Math.floor(s/3600);s%=3600;$('#cm').textContent=Math.floor(s/60);$('#cs').textContent=s%60}
tick();setInterval(tick,1000);

/* ---------- 3D: two gold rings that follow the scroll ---------- */
if(!window.THREE){window.__ready=true;return}
let renderer;try{renderer=new THREE.WebGLRenderer({canvas:$('#gl'),alpha:true,antialias:true})}catch(e){window.__ready=true;return}
const DARK=C.theme==='dark',small=matchMedia('(max-width:820px)');
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));renderer.outputEncoding=THREE.sRGBEncoding;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=DARK?1.2:1.05;
const scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(28,1,.1,100);cam.position.set(0,0,17);
(function(){ /* a studio with softboxes and dark flags, so the gold has something to reflect */
  const env=new THREE.Scene(),k=DARK?.55:1;
  env.add(new THREE.Mesh(new THREE.SphereGeometry(40,32,16),new THREE.MeshBasicMaterial({color:new THREE.Color(1.5*k,1.38*k,1.16*k),side:THREE.BackSide})));
  const box=(w,h,x,y,z,r,g,b)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(r,g,b),side:THREE.DoubleSide}));m.position.set(x,y,z);m.lookAt(0,0,0);env.add(m)};
  box(12,24,-16,6,10,9,8.6,7.6);box(7,26,18,2,8,6,5.6,5);box(24,10,0,20,2,5,4.8,4.2);
  box(40,14,0,-20,0,.05,.04,.03);box(6,40,-4,0,-22,.04,.03,.02);box(5,30,24,-4,-10,.06,.04,.03);box(16,4,8,10,20,.08,.06,.04);
  const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(env,.03).texture;pm.dispose();
})();
scene.add(new THREE.DirectionalLight(0xfff4dc,.6));
const gold=new THREE.MeshStandardMaterial({color:new THREE.Color(1,.72,.3),metalness:1,roughness:.14,envMapIntensity:1.15});
const gold2=new THREE.MeshStandardMaterial({color:new THREE.Color(1,.8,.48),metalness:1,roughness:.22,envMapIntensity:1.1});
const grp=new THREE.Group();scene.add(grp);
const A=new THREE.Mesh(new THREE.TorusGeometry(1,.075,40,160),gold);A.scale.z=2.1;grp.add(A);
const B=new THREE.Mesh(new THREE.TorusGeometry(.9,.06,40,160),gold2);B.scale.z=2.1;grp.add(B);

/* light theme: petals; dark theme: flakes of gold leaf */
const pg=new THREE.PlaneGeometry(1,1.5,5,8);(function(){const p=pg.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),y=p.getY(i),v=y/1.5+.5,w=Math.pow(Math.sin(Math.PI*clamp(v*.94+.03,0,1)),.7);p.setX(i,x*w);p.setZ(i,.5*x*x*w+.16*Math.sin(v*3.1)-.08)}pg.computeVertexNormals()})();
const NP=small.matches?(DARK?10:9):(DARK?18:26),PS=(small.matches?.55:1)*(DARK?.5:1);
const pmat=DARK?new THREE.MeshStandardMaterial({color:new THREE.Color(1,.7,.32),metalness:.75,roughness:.4,side:THREE.DoubleSide,envMapIntensity:.9}):new THREE.MeshStandardMaterial({color:0xffffff,roughness:.62,metalness:0,side:THREE.DoubleSide,envMapIntensity:.55});
const pet=new THREE.InstancedMesh(pg,pmat,NP);scene.add(pet);
const PC=DARK?[[1,1,1],[.9,.85,.8],[1,.95,.85],[.8,.75,.7]]:[[.93,.62,.58],[.98,.8,.74],[.96,.88,.76],[.9,.7,.5]];
const pd=[...Array(NP)].map((_,i)=>{const c=PC[i%4];pet.setColorAt(i,new THREE.Color(c[0],c[1],c[2]));const sx=Math.random()<.5?-1:1;return {x:sx*(.5+Math.random()*.5),y:Math.random(),z:-6+Math.random()*7,s:.16+Math.random()*.22,v:.016+Math.random()*.02,w:Math.random()*6.28,r:Math.random()*6.28}});
/* шашу: a burst of gold when a guest says yes */
const NS=70,sh=new THREE.InstancedMesh(new THREE.CylinderGeometry(.11,.11,.02,18),new THREE.MeshStandardMaterial({color:new THREE.Color(1,.78,.42),metalness:.85,roughness:.42,envMapIntensity:1.25}),NS);sh.visible=false;scene.add(sh);
let sd=[],st=-1;
window.__shashu=()=>{st=performance.now()/1000;sh.visible=true;sd=[...Array(NS)].map(()=>({x:(Math.random()*2-1)*.8,y:-visH*.62,z:Math.random()*2,vx:(Math.random()*2-1)*4.2,vy:8+Math.random()*7,vz:(Math.random()*2-1)*1.5,rx:Math.random()*6,ry:Math.random()*6,wx:(Math.random()*2-1)*9,wy:(Math.random()*2-1)*9,s:.7+Math.random()*.9}))};
const dm=new THREE.Object3D();

let visH=1,visW=1,W=1,H=1,tops=[];
const secs=$$('main section');
function size(){W=innerWidth;H=innerHeight;renderer.setSize(W,H,false);cam.aspect=W/H;cam.updateProjectionMatrix();visH=2*Math.tan(cam.fov*Math.PI/360)*cam.position.z;visW=visH*cam.aspect;tops=secs.map(s=>s.offsetTop)}
window.__size=size;
/* ring poses per section: [x, y (shares of the view), scale, rotX, rotY, rotZ] */
const POSE_D=[[.25,.19,1.12,.95,.5,.2],[.36,.2,.62,1.2,-.5,.3],[0,0,1,0,0,0],[.3,-.02,1.05,.55,1.0,.1],[-.41,-.1,.8,1.25,.3,-.4],[.34,-.12,.72,.3,.2,0]];
const POSE_M=[[.18,.19,.46,.95,.5,.2],[.2,.34,.34,1.2,-.5,.3],[0,0,1,0,0,0],[.26,.36,.36,.55,1.0,.1],[-.3,.36,.34,1.25,.3,-.4],[.24,.36,.3,.3,.2,0]];
const cur={x:0,y:0,s:1,rx:.95,ry:.5,rz:.2,k:0};let first=true,mx=0,my=0;
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth*2-1;my=e.clientY/innerHeight*2-1});

function frame(now){
  const t=now/1000,dt=Math.min(.1,t-(frame.t||t));frame.t=t;
  const y=window.__y!==undefined?window.__y:scrollY+H*.35;let i=0;for(let k=0;k<tops.length;k++)if(y>=tops[k])i=k;
  const nxt=Math.min(tops.length-1,i+1),span=(tops[nxt]-tops[i])||1,fr=i===nxt?0:ease(clamp((y-tops[i])/span,0,1)),f=i+fr;
  const P=small.matches?POSE_M:POSE_D,a=P[i],b=P[nxt],tg=a.map((v,j)=>mix(v,b[j],fr));
  let tx=tg[0]*visW,ty=tg[1]*visH,ts=tg[2];
  /* near the date section the rings fly to the day in the calendar and close around it */
  const k=clamp(1-Math.abs(f-2)/.55,0,1),day=$('#theday');
  if(k>0&&day){const r=day.getBoundingClientRect(),cx=(r.left+r.width/2)/W-.5,cy=-((r.top+r.height/2)/H-.5),sc=r.width*.6/H*visH,e=ease(k);tx=mix(tx,cx*visW,e);ty=mix(ty,cy*visH,e);ts=mix(ts,sc,e)}
  const q=first?1:1-Math.exp(-dt*5.5);first=false;
  cur.x+=(tx-cur.x)*q;cur.y+=(ty-cur.y)*q;cur.s+=(ts-cur.s)*q;cur.rx+=(tg[3]-cur.rx)*q;cur.ry+=(tg[4]-cur.ry)*q;cur.rz+=(tg[5]-cur.rz)*q;cur.k+=(ease(k)-cur.k)*q;
  /* when it is locked on the date the ring follows the page exactly, no lag */
  const lock=cur.k>.97;
  grp.position.set(lock?tx:cur.x,(lock?ty:cur.y)+Math.sin(t*.9)*.05*(1-cur.k),0);grp.scale.setScalar(cur.s);
  const wob=1-cur.k;grp.rotation.set(cur.rx*wob+(Math.sin(t*.5)*.1+my*.08)*wob,cur.ry*wob+(Math.sin(t*.37)*.16+mx*.14)*wob+f*.35*wob,cur.rz*wob);
  B.position.set(.92*wob,.04*wob,0);B.rotation.set(1.18*wob,.36*wob,0);B.scale.set(mix(.82,1,wob),mix(.82,1,wob),2.1);
  pd.forEach((o,n)=>{const yy=((o.y-t*o.v)%1+1)%1;dm.position.set(o.x*visW*.6+Math.sin(t*.5+o.w)*.3,(yy-.5)*visH*1.3,o.z);dm.rotation.set(o.r+t*.4,o.w+t*.3,t*.22+o.r);dm.scale.setScalar(o.s*PS);dm.updateMatrix();pet.setMatrixAt(n,dm.matrix)});pet.instanceMatrix.needsUpdate=true;
  if(sh.visible){const e=t-st;if(e>3.2){sh.visible=false}else{sd.forEach((o,n)=>{dm.position.set(o.x+o.vx*e,o.y+o.vy*e-6.5*e*e,o.z+o.vz*e);dm.rotation.set(o.rx+o.wx*e,o.ry+o.wy*e,0);dm.scale.setScalar(o.s*clamp((3.2-e)*2,0,1));dm.updateMatrix();sh.setMatrixAt(n,dm.matrix)});sh.instanceMatrix.needsUpdate=true}}
  renderer.render(scene,cam);
  /* names drift apart as the hero scrolls away */
  const hp=clamp(scrollY/H,0,1.2);$('.n1').style.transform=`translateX(${(-hp*6).toFixed(2)}vw)`;$('.n2').style.transform=`translateX(${(hp*6).toFixed(2)}vw)`;
  requestAnimationFrame(frame);
}
size();addEventListener('resize',size);if(window.ResizeObserver)new ResizeObserver(size).observe(document.body);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(size);
requestAnimationFrame(frame);window.__ready=true;
})();
